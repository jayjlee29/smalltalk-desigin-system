<!-- @dsCard group="Colors" viewport="700x160" subtitle="Accent + semantic states" name="Semantic & Accent" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:16px;background:#fff;display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;gap:10px">
    <div style="flex:1;text-align:center">
      <div style="height:48px;border-radius:8px;background:var(--blue-600)"></div>
      <div style="font-size:11px;color:var(--gray-600);margin-top:4px">accent (blue-600)</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:48px;border-radius:8px;background:var(--red-500)"></div>
      <div style="font-size:11px;color:var(--gray-600);margin-top:4px">danger / gain ↑ (red-500)</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:48px;border-radius:8px;background:var(--green-600)"></div>
      <div style="font-size:11px;color:var(--gray-600);margin-top:4px">success / enabled (green-600)</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:48px;border-radius:8px;background:var(--blue-500)"></div>
      <div style="font-size:11px;color:var(--gray-600);margin-top:4px">loss ↓ (blue-500)</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:48px;border-radius:8px;background:var(--purple-700)"></div>
      <div style="font-size:11px;color:var(--gray-600);margin-top:4px">badge: 연금저축</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:48px;border-radius:8px;background:var(--orange-700)"></div>
      <div style="font-size:11px;color:var(--gray-600);margin-top:4px">badge: IRP</div>
    </div>
  </div>
</div>
