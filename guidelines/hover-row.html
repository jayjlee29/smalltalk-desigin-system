<!-- @dsCard group="Brand" viewport="700x160" subtitle="Signature: list rows invert to blue-600 on hover" name="Row Hover Pattern" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:16px;background:#fff">
  <div style="border:1px solid var(--gray-200);border-radius:8px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--gray-200)">
      <div><p style="margin:0;font-weight:500;color:var(--gray-900);font-size:14px">자유게시판</p><p style="margin:2px 0 0;font-size:12px;color:var(--gray-500)">자유롭게 이야기해요</p></div>
      <span style="font-size:11px;padding:4px 10px;border-radius:9999px;background:var(--blue-50);color:var(--blue-600);font-weight:500">활성</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--blue-600)">
      <div><p style="margin:0;font-weight:500;color:#fff;font-size:14px">공지사항</p><p style="margin:2px 0 0;font-size:12px;color:var(--blue-100)">← hover state</p></div>
      <span style="font-size:11px;padding:4px 10px;border-radius:9999px;background:#fff;color:var(--blue-600);font-weight:500">활성</span>
    </div>
  </div>
</div>
