<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Corner radii in use" name="Radius" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:16px;background:#fff;display:flex;gap:16px">
  <div style="text-align:center"><div style="width:64px;height:64px;background:var(--gray-100);border-radius:4px"></div><div style="font-size:11px;color:var(--gray-500);margin-top:4px">4px default</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;background:var(--gray-100);border-radius:8px"></div><div style="font-size:11px;color:var(--gray-500);margin-top:4px">8px lg (btn/input)</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;background:var(--gray-100);border-radius:12px"></div><div style="font-size:11px;color:var(--gray-500);margin-top:4px">12px xl (cards)</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;background:var(--gray-100);border-radius:9999px"></div><div style="font-size:11px;color:var(--gray-500);margin-top:4px">full (pills)</div></div>
</div>
