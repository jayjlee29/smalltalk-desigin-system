<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Tailwind default scale in use" name="Spacing Scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;gap:10px" data-s="4"><div style="width:4px;height:14px;background:var(--blue-600)"></div><span style="font-size:11px;color:var(--gray-500);font-family:var(--font-mono)">4px — space-1</span></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="width:8px;height:14px;background:var(--blue-600)"></div><span style="font-size:11px;color:var(--gray-500);font-family:var(--font-mono)">8px — space-2 (gap-2)</span></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="width:12px;height:14px;background:var(--blue-600)"></div><span style="font-size:11px;color:var(--gray-500);font-family:var(--font-mono)">12px — space-3 (px-3)</span></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="width:16px;height:14px;background:var(--blue-600)"></div><span style="font-size:11px;color:var(--gray-500);font-family:var(--font-mono)">16px — space-4 (px-4, py-4)</span></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="width:24px;height:14px;background:var(--blue-600)"></div><span style="font-size:11px;color:var(--gray-500);font-family:var(--font-mono)">24px — space-6 (mb-6)</span></div>
  <div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:14px;background:var(--blue-600)"></div><span style="font-size:11px;color:var(--gray-500);font-family:var(--font-mono)">32px — space-8 (py-8)</span></div>
</div>
