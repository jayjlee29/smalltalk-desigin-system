<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:#fff;font-family:var(--font-sans)"></div>
<script type="text/plain" id="app-src">
  const { Button } = window.SmalltalkDS;
  function Demo() {
    return (
      <div style={{display:"flex", flexDirection:"column", gap:14}}>
        <div style={{display:"flex", gap:10, alignItems:"center"}}>
          <Button variant="primary">로그인</Button>
          <Button variant="secondary">취소</Button>
          <Button variant="danger">삭제</Button>
          <Button variant="ghost">수정</Button>
          <Button variant="primary" disabled>가입 중...</Button>
        </div>
        <div style={{display:"flex", gap:10, alignItems:"center"}}>
          <Button variant="secondary" size="sm">답글</Button>
          <Button variant="primary" size="sm">댓글 등록</Button>
        </div>
        <div style={{maxWidth:280}}>
          <Button variant="primary" size="lg">회원가입</Button>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));
</script>
<script>
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
</script>
