<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:#fff;font-family:var(--font-sans)"></div>
<script type="text/plain" id="app-src">
  const { Card } = window.SmalltalkDS;
  function Demo() {
    return (
      <div style={{display:"flex", flexDirection:"column", gap:14}}>
        <Card gradient>
          <p style={{fontSize:12,color:"var(--gray-500)",margin:0}}>포트폴리오 전체</p>
          <p style={{fontSize:20,fontWeight:700,marginTop:8}}>2.14억원</p>
        </Card>
        <div style={{display:"flex", gap:12}}>
          <Card elevated hoverable padding={16}>
            <p style={{fontSize:14,fontWeight:600,margin:0}}>미래에셋 ISA</p>
            <p style={{fontSize:12,color:"var(--gray-400)",marginTop:4}}>hover me</p>
          </Card>
          <Card elevated padding={16}>
            <p style={{fontSize:14,fontWeight:600,margin:0}}>한투 연금저축</p>
          </Card>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));
</script>
<script>
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
</script>
